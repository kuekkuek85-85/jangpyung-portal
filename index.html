<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장평 포털 — 장평중학교 교사용 대시보드</title>
  <meta name="description" content="장평중학교 수업·업무 관련 도구를 한 곳에서 바로 접근하는 교사용 웹 포털" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { DEFAULT: '#4338CA' },
            sky:    { DEFAULT: '#0EA5E9' },
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- ── 헤더 ────────────────────────────────────────────── -->
  <header class="portal-header sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center gap-3">

      <!-- 로고 + 타이틀 -->
      <div class="flex items-center gap-3 flex-1">
        <span class="text-3xl leading-none" aria-hidden="true">🏫</span>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">장평 포털</h1>
          <p class="text-indigo-200 text-xs">Jangpyeong Middle School · 교사용 대시보드</p>
        </div>
      </div>

      <!-- 카테고리 탭 -->
      <nav id="tab-nav" class="flex flex-wrap gap-2" role="tablist" aria-label="카테고리 탭"></nav>
    </div>
  </header>

  <!-- ── 메인 콘텐츠 ──────────────────────────────────────── -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">

    <!-- 섹션: 전체/카테고리별 -->
    <div id="portal-sections">
      <!-- app.js가 동적으로 주입 -->
    </div>

    <!-- 빈 결과 -->
    <div id="empty-state" class="hidden text-center py-24 text-slate-400">
      <span class="text-5xl block mb-3">🔍</span>
      <p class="text-lg">해당 카테고리에 항목이 없습니다.</p>
    </div>
  </main>

  <!-- ── 푸터 ────────────────────────────────────────────── -->
  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-slate-400">
      <span>Made with ❤️ by <strong class="text-slate-600">이승엽</strong> · 장평중학교 정보 교사</span>
      <span>에듀집(EduZip) 공개 자료 · MIT License</span>
    </div>
  </footer>

  <!-- 스크립트 -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
